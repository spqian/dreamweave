name: Release package

# Builds a downloadable, source-only install zip that a user can unzip and
# hand to their Microsoft Scout or Hermes agent ("import this") — the agent follows
# INSTALL.md, selects the target harness, and follows its adapter guide.
#
# The zip is intentionally source-only: the native deps (better-sqlite3,
# sqlite-vec) are platform/arch/Node-version specific and are built by the
# user's `npm install`, exactly as INSTALL.md documents.
#
#   * Push a tag `vX.Y.Z`  -> builds the zip AND publishes a GitHub Release.
#   * Run manually         -> builds the zip and uploads it as a workflow
#                             artifact (no release), for a dry run / preview.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the zip (e.g. v0.1.0). Defaults to package.json version."
        required: false
        type: string

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python for the Hermes adapter
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Smoke test (native build + engine)
        run: npm test

      - name: Hermes adapter regressions
        run: npm run test:hermes

      - name: Resolve version + package name
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="v$(node -p "require('./package.json').version")"
          fi
          echo "version=${VER}"        >> "$GITHUB_OUTPUT"
          echo "name=dreamweave-${VER}" >> "$GITHUB_OUTPUT"

      - name: Build install zip
        run: |
          NAME="${{ steps.ver.outputs.name }}"
          # git archive honors the `export-ignore` rules in .gitattributes, so
          # dev-only paths (bench/, .github/, dotfiles) are dropped, and only
          # committed files are ever included (no scratch/db/log leakage).
          git archive --format=zip --prefix="${NAME}/" -o "${NAME}.zip" HEAD
          echo "ZIP=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Verify zip contents
        run: |
          NAME="${{ steps.ver.outputs.name }}"
          echo "--- package contents ---"
          unzip -l "${NAME}.zip"
          # Required files that make the package installable/runnable.
          for f in \
            "${NAME}/INSTALL.md" \
            "${NAME}/README.md" \
            "${NAME}/LICENSE" \
            "${NAME}/package.json" \
            "${NAME}/package-lock.json" \
            "${NAME}/setup.js" \
            "${NAME}/config.js" \
            "${NAME}/src/dream.js" \
            "${NAME}/skills/dream/SKILL.md" \
            "${NAME}/skills/graph-recall/SKILL.md" \
            "${NAME}/harness-adapters/MicrosoftScout/install.md" \
            "${NAME}/harness-adapters/MicrosoftScout/scripts/install-skills.js" \
            "${NAME}/harness-adapters/hermes-agent/install.md" \
            "${NAME}/harness-adapters/hermes-agent/scripts/install.py" \
            "${NAME}/harness-adapters/hermes-agent/scripts/dreamweave_harness.py" \
            "${NAME}/harness-adapters/hermes-agent/scripts/dreamweave.py" \
            "${NAME}/harness-adapters/hermes-agent/scripts/adapter-snapshot.js" \
            "${NAME}/harness-adapters/hermes-agent/skills/graph-recall/SKILL.md" \
            "${NAME}/harness-adapters/hermes-agent/skills/dream/references/nightly-harness.md" \
            "${NAME}/harness-adapters/hermes-agent/skills/dream/SKILL.md"; do
            if ! unzip -l "${NAME}.zip" | grep -qE " ${f}\$"; then
              echo "::error::missing required file in package: ${f}"
              exit 1
            fi
          done
          # Guard against dev-only paths leaking into the package.
          if unzip -l "${NAME}.zip" | grep -qE " ${NAME}/(bench|\.github)/"; then
            echo "::error::dev-only path leaked into package"
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Download **${{ env.ZIP }}** below, unzip it, and tell your Microsoft Scout or Hermes Agent assistant to *import this* — it will detect \`INSTALL.md\`, confirm the harness, follow its adapter installer, and interview you on the four behavioral knobs.

          **Prerequisites:** Node >= 20 (current LTS recommended), Python >= 3.11 for Hermes (POSIX), and a toolchain that can build \`better-sqlite3\` (prebuilt binaries cover most platforms). First run downloads a small embedding model once, then works offline.

          Source-only by design: native deps are built by your \`npm install\`."

          # A release may already exist when the tag was published by hand. Attaching the
          # zip still has to happen, otherwise the release ships with no download at all —
          # so upload into the existing release rather than failing the job. Hand-written
          # notes are left alone; only the missing asset is filled in.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — attaching ${{ env.ZIP }} to it."
            gh release upload "${GITHUB_REF_NAME}" "${{ env.ZIP }}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${{ env.ZIP }}" \
              --title "dreamweave ${GITHUB_REF_NAME}" \
              --verify-tag \
              --notes "${NOTES}"
          fi

          # Guarantee the invariant the job exists to uphold: the release has its zip.
          gh release view "${GITHUB_REF_NAME}" --json assets \
            --jq '.assets[].name' | grep -qx "${{ env.ZIP }}"
          echo "Verified ${{ env.ZIP }} is attached to ${GITHUB_REF_NAME}."
